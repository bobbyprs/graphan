apiVersion: v1
kind: ConfigMap
metadata:
  name: graphan-config
  namespace: graphan
data:
  NODE_ENV: production
  PORT: "4000"
  LOG_LEVEL: info
  CORS_ORIGINS: https://graphan.example.com
  APP_PUBLIC_URL: https://graphan.example.com
  QUERY_MAX_ROWS: "10000"
  QUERY_TIMEOUT_MS: "30000"
  SMTP_HOST: smtp.example.com
  SMTP_PORT: "587"
  SMTP_FROM: "Graphan Alerts <alerts@example.com>"
  SQLITE_BASE_DIR: /data/sqlite
---
# ⚠️ Example only. In production, source these from an external secret manager
# (External Secrets Operator, Sealed Secrets, Vault CSI) — never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: graphan-secrets
  namespace: graphan
type: Opaque
stringData:
  DATABASE_URL: postgresql://graphan:CHANGE_ME@graphan-postgres:5432/graphan?schema=public
  POSTGRES_PASSWORD: CHANGE_ME
  JWT_ACCESS_SECRET: CHANGE_ME_TO_A_RANDOM_64_CHAR_STRING_________________________
  JWT_REFRESH_SECRET: CHANGE_ME_TO_ANOTHER_RANDOM_64_CHAR_STRING__________________
  # node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
  CREDENTIALS_ENCRYPTION_KEY: REPLACE_WITH_32_BYTE_BASE64_KEY_xxxxxxxxxxx=
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  # Signed embedding into other apps (empty = disabled). Share this value with those apps' backends only.
  EMBED_SECRET: ""
  SEED_ADMIN_EMAIL: admin@graphan.local
  SEED_ADMIN_PASSWORD: CHANGE_ME_Admin@1
