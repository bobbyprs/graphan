apiVersion: v1
kind: ServiceAccount
metadata:
  name: graphan-api
  namespace: graphan
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphan-api
  namespace: graphan
  labels: { app: graphan-api }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: graphan-api }
  template:
    metadata:
      labels: { app: graphan-api }
    spec:
      serviceAccountName: graphan-api
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: graphan-api }
      containers:
        - name: api
          image: ghcr.io/your-org/graphan-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 4000 }
          envFrom:
            - configMapRef: { name: graphan-config }
            - secretRef: { name: graphan-secrets }
          env:
            # Background jobs use a Postgres advisory lock, so only one replica runs them.
            - { name: ENABLE_SCHEDULER, value: "true" }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 1536Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: sqlite, mountPath: /data/sqlite, readOnly: true }
      volumes:
        - { name: tmp, emptyDir: {} }
        # Optional: SQLite files to expose as data sources (mount a PVC/ConfigMap instead)
        - { name: sqlite, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: graphan
spec:
  selector: { app: graphan-api }
  ports:
    - { name: http, port: 4000, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: graphan-api
  namespace: graphan
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: graphan-api }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
    - type: Resource
      resource: { name: memory, target: { type: Utilization, averageUtilization: 80 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: graphan-api
  namespace: graphan
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: graphan-api }
