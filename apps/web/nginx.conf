# Serves the SPA and reverse-proxies /api and /ws to the API service.
# API_UPSTREAM resolves via Docker/K8s DNS ("api" service).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream graphan_api {
  server api:4000;
  keepalive 32;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  client_max_body_size 4m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' ws: wss: https://cdn.jsdelivr.net; worker-src 'self' blob:; frame-ancestors 'self'" always;

  location = /nginx-health { access_log off; return 200 "ok"; }

  location /api/ {
    proxy_pass http://graphan_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  location /ws/ {
    proxy_pass http://graphan_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
  }

  # Hashed assets: cache forever
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Signed embeds: the only pages other sites may frame. EMBED_FRAME_ANCESTORS (space-separated origins,
  # e.g. "https://app.example.com https://admin.example.com") is substituted at container start.
  # add_header here replaces the server-level headers, so the safe ones are repeated.
  location /embed/ {
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' ws: wss: https://cdn.jsdelivr.net; worker-src 'self' blob:; frame-ancestors 'self' ${EMBED_FRAME_ANCESTORS}" always;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }

  # SPA fallback; never cache index.html
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
